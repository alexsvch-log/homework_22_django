{% extends 'catalog/base.html' %}

{% block title %}Удаление статьи — Блог{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card box-shadow border-0 shadow-sm text-center p-4">
                <div class="card-body">
                    <h2 class="text-danger mb-4">⚠ Подтверждение удаления</h2>
                    <p class="lead text-secondary mb-4">Вы уверены, что хотите навсегда удалить статью <strong>«{{ object.title }}»</strong>? Это действие нельзя будет отменить.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-6">
                                <a href="{% url 'blog:list' %}" class="btn btn-lg w-100 btn-outline-secondary">Отмена</a>
                            </div>
                            <div class="col-6">
                                <button type="submit" class="btn btn-lg w-100 btn-danger fw-bold">Да, удалить</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
