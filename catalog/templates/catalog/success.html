<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Успешно отправлено</title>
    <!-- Подключение стилей Bootstrap -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <!-- Стили для красивого шрифта и плавного появления -->
    <style>
        @import url('https://googleapis.com');

        body {
            font-family: 'Nunito', sans-serif;
            /* Красивый мягкий градиент на фоне вместо скучного серого */
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
            min-height: 100vh;
        }

        .animated-card {
            /* Плавное появление карточки снизу вверх при загрузке */
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
            border: none;
            border-radius: 20px;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="d-flex align-items-center">

    <div class="container text-center">
        <!-- Добавили класс animated-card, увеличили внутренние отступы (p-5), сделали тень мягче (shadow) -->
        <div class="card p-5 shadow mx-auto animated-card" style="max-width: 550px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);">

            <!-- Иконка галочки для визуального акцента -->
            <div class="mb-4">
                <span style="font-size: 4rem;">✅</span>
            </div>

            <!-- Сделали буквы жирнее (fw-bold) и добавили красивый изумрудный цвет текста -->
            <h1 class="text-success fw-bold mb-3" style="letter-spacing: -0.5px;">Спасибо, {{ name }}!</h1>

            <!-- Текст описания сделали чуть темнее для лучшей читаемости -->
            <p class="lead text-secondary mb-4 fs-5">Ваше сообщение успешно получено. Мы свяжемся с вами в ближайшее время.</p>

            <!-- Сделали кнопки яркими и интерактивными -->
            <div class="d-flex justify-content-center gap-3">
                <!-- Главная кнопка теперь яркая синяя (btn-primary) -->
                <a href="{% url 'catalog:home' %}" class="btn btn-primary btn-lg px-4 shadow-sm">На главную</a>

                <!-- Вторая кнопка — аккуратная контурная (btn-outline-primary) -->
                <a href="{% url 'catalog:contacts' %}" class="btn btn-outline-primary btn-lg px-4">Назад</a>
            </div>
        </div>
    </div>
    <!-- 1. Сначала подключаем локальную библиотеку салюта, которую создали сами -->
    <script src="{% static 'js/canvas-confetti.min.js' %}"></script>
    <!-- Подключаем наш собственный вынесенный JS-файл с эффектами -->
    <script src="{% static 'js/success_effects.js' %}"></script>
</body>
</html>
