<div class="bg-white border-bottom box-shadow fixed-top">
    <div class="container d-flex flex-column flex-md-row align-items-center p-3 px-md-4">
        <h5 class="my-0 mr-md-auto font-weight-bold text-dark" style="letter-spacing: 0.5px;">Online Strange Store</h5>
        <nav class="ms-md-auto mt-2 mt-md-0 d-flex align-items-center">
            <a class="p-2 btn btn-outline-primary me-2" href="{% url 'catalog:home' %}">Каталог</a>
            <a class="p-2 btn btn-outline-primary me-2" href="{% url 'blog:list' %}">Блог</a>
            <a class="p-2 btn btn-outline-primary me-2" href="{% url 'catalog:contacts' %}">Контакты</a>

            {% if user.is_authenticated %}
                <a class="p-2 btn btn-success text-white me-3" href="{% url 'catalog:product_create' %}">+ Добавить товар</a>
            {% endif %}

            <div class="ms-3 border-start ps-3 d-flex align-items-center">
                {% if user.is_authenticated %}
                     <!-- Клик по Email переводит на редактирование профиля -->
                     <a href="{% url 'users:profile' %}" class="text-dark small fw-bold me-3 text-decoration-none">👤 {{ user.email }}</a>

                      <!-- Форма для безопасного выхода методом POST по стандартам Django 5+ -->
                      <form method="post" action="{% url 'users:logout' %}" class="d-inline">
                      {% csrf_token %}
                       <button type="submit" class="btn btn-sm btn-outline-danger fw-bold">Выйти</button>
                      </form>
                {% else %}
    <!-- Если гость: кнопки авторизации (оставляем без изменений) -->
    <a class="btn btn-sm btn-outline-secondary fw-bold me-2" href="{% url 'users:login' %}">Войти</a>
    <a class="btn btn-sm btn-primary fw-bold" href="{% url 'users:register' %}">Регистрация</a>
{% endif %}
            </div>
        </nav>
    </div>
</div>
